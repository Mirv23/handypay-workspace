  const opts=(S.tplMsg||[]).filter(x=>x.active).map(x=>'<option value="'+esc(x.id)+'"'+(tpl&&x.id===tpl.id?" selected":"")+">"+esc(x.name)+"</option>").join("");

    (dueTxt?" · "+dueTxt:"")+(f.last_contact_at?" · contacté "+esc(ago(f.last_contact_at)):"")+(f.source?" · "+esc(f.source):"")+"</div>"+

      '<a class="btn wa" target="_blank" rel="noopener noreferrer" data-wa="'+esc(f.id)+'" href="'+esc(waHref(f.phone,msg))+'">'+ic("wa",16)+"Ouvrir WhatsApp</a>"+

async function loadFollowups(){
  const F=S.fo,seq=++S.seq,el=$("#fo-list");if(!el)return;
  const qs=new URLSearchParams({view:F.view,stage:F.stage,status:F.status,assignee:F.view==="all"?F.assignee:"",q:F.q,offset:String(F.offset),limit:"50"});
  if(!F.items.length)el.innerHTML='<div class="muted" style="padding:8px">Chargement…</div>';
  let r;try{r=await api("GET",API+"/followups?"+qs)}catch(e){if(seq===S.seq&&$("#fo-list"))$("#fo-list").innerHTML='<div class="empty card">'+esc(e.message)+"</div>";return}
  if(seq!==S.seq||S.view!=="relances"||!$("#fo-list"))return;
  F.items=r.items;F.total=r.total;S.foDue=r.mine_due;renderNav();$("#fo-due").textContent=S.foDue||"";
  const empty=F.view==="mine"?(F.stage||F.status||F.q?"Aucune fiche de ta file ne correspond.":"Ta file est vide pour aujourd'hui. "+(isLead()?"Importe des fiches ou répartis les fiches non assignées.":"Demande à un responsable de t'en attribuer.")):"Aucune fiche ne correspond.";
  $("#fo-list").innerHTML=r.items.length?r.items.map(foCard).join(""):'<div class="empty card">'+esc(empty)+"</div>";
  const end=Math.min(F.offset+r.items.length,r.total);
  $("#fo-pager").innerHTML=r.total>r.items.length||F.offset?'<button class="btn sm" data-fo="prev"'+(F.offset?"":" disabled")+'>◀ Précédentes</button><span class="small muted">'+(F.offset+1)+"–"+end+" sur "+intf(r.total)+'</span><button class="btn sm" data-fo="next"'+(end<r.total?"":" disabled")+">Suivantes ▶</button>":(r.total?'<span class="small muted">'+intf(r.total)+" fiche"+(r.total>1?"s":"")+"</span>":"");
}

async function foWhatsApp(id){
  const sel=$('[data-fo-tpl="'+id+'"]'),tid=sel?sel.value:"";

  if(seq!==S.seq||S.view!=="soir")return;

    (s.direct?'<div class="prow"><span class="pn">'+hpAv(null)+' Direct (HandyPay)</span><span data-l="Cartes"><b>'+s.direct+'</b></span><span data-l="Relances">–</span><span data-l="Réponses">–</span><span data-l="Closes">–</span><span data-l="Non-lus">–</span></div>':"")+
    "</div></div>";
  const n=r.my_note;
  if(canEdit())h+='<form class="card sec" id="ev-form" style="margin-top:16px"><h2>Mon formulaire du soir <span class="small muted">'+esc(fmtDay(day))+"</span></h2>"+

async function patchTask(id,changes,quiet){
  const before=S.tasks.get(id);if(!before)return;
  S.tasks.set(id,Object.assign({},before,changes));if(!quiet){renderNav();render()}
  try{const r=await api("PATCH",API+"/tasks/"+id,changes);S.tasks.set(id,r.task);
    if(r.spawned){S.tasks.set(r.spawned.id,r.spawned);toast("Tâche récurrente : prochaine occurrence le "+fmtD(r.spawned.due_date)+".")}
    if(!quiet){renderNav();render()}if(S.openTask===id&&!quiet)refreshDrawerTask(r.task);return r.task;
  }catch(e){S.tasks.set(id,before);renderNav();render();fail(e)}
}
async function toggleDone(id){const t=S.tasks.get(id);if(!t)return;
  const r=await patchTask(id,{status:t.status==="fait"?"a_faire":"fait"});
  if(r&&r.status==="fait")toast("« "+r.title+" » faite.",null,{label:"Annuler",run:()=>patchTask(id,{status:t.status})});
}

/* Saisie rapide : « Titre @pseudo !haute #étiquette demain » */
function parseQuick(src){
  const out={title:src,labels:[]};let s=" "+src+" ";
  s=s.replace(/\s@([A-Za-z0-9_.\-]{2,80})(?=\s)/g,(m,u)=>{const mm=S.members.find(x=>x.username.toLowerCase()===u.toLowerCase());if(mm){out.assignee=mm.username;return " "}return m});
  s=s.replace(/\s!(urgente|urgent|haute|normale|basse|1|2|3|4)(?=\s)/gi,(m,p)=>{p=p.toLowerCase();out.priority={urgent:"urgente","1":"urgente","2":"haute","3":"normale","4":"basse"}[p]||p;return " "});
  s=s.replace(/\s#([^\s#]{1,30})(?=\s)/g,(m,l)=>{if(/^\d+$/.test(l))return m;out.labels.push(l.toLowerCase());return " "});
  const t=today(),days=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  s=s.replace(/\s(aujourd'hui|aujourdhui|demain|après-demain|apres-demain|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\+\d{1,3}j|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?=\s)/i,(m,w)=>{w=w.toLowerCase();
    if(w.startsWith("aujourd"))out.due_date=t;else if(w==="demain")out.due_date=addDays(t,1);else if(w.startsWith("apr"))out.due_date=addDays(t,2);
    else if(w[0]==="+")out.due_date=addDays(t,parseInt(w.slice(1)));
    else if(w.includes("/")){const [d,mo,y]=w.split("/").map(Number);let yy=y?(y<100?2000+y:y):new Date().getFullYear();let c=yy+"-"+pad(mo)+"-"+pad(d);if(!y&&c<t)c=(yy+1)+"-"+pad(mo)+"-"+pad(d);
      const dd=parseD(c);if(dd&&!isNaN(dd)&&iso(dd)===c)out.due_date=c;else return m}
    else{const k=days.indexOf(w);let n=(k-parseD(t).getDay()+7)%7;if(n===0)n=7;out.due_date=addDays(t,n)}return " "});
  out.title=s.replace(/\s+/g," ").trim();return out;
}

   (app/finances.py) fait tous les calculs et décide des droits ; la page affiche.

const FIN={seq:0,data:null};
const FIN_M={moncash:"MonCash",natcash:"NatCash",handypay:"HandyPay",especes:"Espèces"};
const FIN_ST={en_attente:["En attente","warn"],validee:["Validée","ok"],refusee:["Refusée","danger"]};
const FIN_MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const FIN_COL={charges:"#64748B",salaires:"var(--primary)",dette:"var(--accent)",reserve:"#319795",primes:"var(--ok)",croissance:"var(--ai)"};
// « 1 920 $ » : espace insécable pour les milliers et devant le symbole ; centimes seulement s'il y en a.
function fm(v){const c=Math.round((Number(v)||0)*100),a=Math.abs(c),u=Math.floor(a/100),d=a%100;
  return (c<0?"−":"")+String(u).replace(/\B(?=(\d{3})+(?!\d))/g," ")+(d?","+String(d).padStart(2,"0"):"")+" $"}
function finMonthL(k){return FIN_MOIS[Number(k.slice(5,7))-1]+" "+k.slice(0,4)}
function finShift(k,n){let y=Number(k.slice(0,4)),m=Number(k.slice(5,7))-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+pad(m+1)}
function finMonth(){return S.param&&/^\d{4}-(0[1-9]|1[0-2])$/.test(S.param)?S.param:today().slice(0,7)}
function finPct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function finCards(n){return n==null?"–":intf(n)}
async function vFinances(){
  if(!canEdit()){V().innerHTML='<div class="empty card">Les finances sont réservées aux responsables et aux membres de l\'équipe.</div>';return}
  const month=finMonth(),seq=++FIN.seq;
  if(!$("#fin-root"))V().innerHTML='<div id="fin-root" class="muted">Chargement…</div>';
  let r;try{r=await api("GET",API+"/finances?mois="+month)}
  catch(e){if(seq===FIN.seq&&S.view==="finances")V().innerHTML='<div class="empty card">'+esc(e.message)+"</div>";return}
  if(seq!==FIN.seq||S.view!=="finances")return;
  FIN.data=r;V().innerHTML=finHTML(r);
}
function finSummary(r){
  const pj=r.projection,ai=r.arrears_in.total,ao=r.arrears_out.total,res=r.steps[3],miss=r.steps.slice(0,4).reduce((t,s)=>t+s.missing,0);
  let cls="warn",msg;
  if(r.is_future){cls="";msg="Mois à venir : rien n'est encore vendu."}
  else if(r.covered){cls="ok";msg="<b>Tout est payé"+(r.is_current?" pour l'instant":"")+"</b> : charges, salaires, dette et réserve. Prime : <b>"+fm(r.surplus.bonus_each)+"</b> par personne."}
  else if(r.is_current){msg="<b>Pour l'instant, la marge ne couvre pas tout</b> : il manque "+fm(miss)+(r.threshold.cards_left?", soit encore "+intf(r.threshold.cards_left)+" carte"+(r.threshold.cards_left>1?"s":""):"")+"."+
    (pj?" À ce rythme ("+num(pj.per_day)+" cartes par jour), le mois finira vers <b>"+intf(pj.cards)+" cartes</b> : "+(pj.reached?"tout sera payé, avec "+fm(pj.bonus_each)+" de prime chacun.":"il manquera encore "+fm(pj.missing)+"."):"")}
  else if(ao>0)msg="<b>Mois sous le seuil</b> : "+fm(ao)+" n'ont pas pu être payés. Ils passent en arriéré sur "+finMonthL(finShift(r.month,1))+", avant toute prime.";
  else msg="<b>Réserve incomplète</b> : il lui manque "+fm(res.missing)+" (la réserve n'est pas reportée).";
  if(ai>0)msg+=" Ce mois rattrape d'abord "+fm(ai)+" d'arriérés.";
  if(r.before_start)msg+=" Ce mois précède le début du suivi ("+finMonthL(r.start_month)+") : aucun arriéré n'y est compté.";
  return '<div class="fin-note '+cls+'">'+msg+"</div>";
}
function finStep(s,r){
  const short=s.missing>0,cls=s.due>0?(short?" short":" ok"):"";
  let h='<div class="fin-step'+cls+'"><span class="fin-rk">'+s.rank+'</span><div><div class="fin-sh"><b>'+esc(s.title)+'</b><span class="fin-amt">'+fm(s.paid)+(s.due!==s.paid?" <small>sur "+fm(s.due)+"</small>":"")+"</span></div>"+
    '<div class="fin-ex">'+esc(s.explain)+"</div>"+
    (s.due>0?'<div class="fin-bar" aria-hidden="true"><i class="p" style="width:'+finPct(s.paid,s.due)+'%"></i><i class="m" style="width:'+finPct(s.missing,s.due)+'%"></i></div>':"");
  const tags=[];
  if(s.arrears_in>0)tags.push('<span class="pill warn">dont '+fm(s.arrears_in)+" d'arriéré</span>");
  if(short)tags.push('<span class="pill danger">manque '+fm(s.missing)+(s.key==="reserve"?" (non reporté)":r.is_past?" → reporté":"")+"</span>");
  else if(s.due>0)tags.push('<span class="pill ok">payé ✓</span>');
  if(s.key==="dette")tags.push('<span class="pill">solde au 1er du mois : '+fm(s.balance_start)+"</span>");
  if(tags.length)h+='<div class="fin-tags">'+tags.join("")+"</div>";
  let lines="";
  if(s.key==="charges")lines=s.lines.map(x=>"<div><span>"+esc(x.label)+(x.note?" <small>("+esc(x.note)+")</small>":"")+(x.spent?" <small>· dépensé "+fm(x.spent)+"</small>":"")+'</span><span class="v">'+fm(x.paid)+(x.missing?" <small>sur "+fm(x.due)+"</small>":"")+"</span></div>").join("");
  if(s.key==="salaires")lines=s.lines.map(x=>"<div><span>"+esc(x.display_name)+(x.arrears_in?" <small>("+fm(x.base)+" + "+fm(x.arrears_in)+" d'arriéré)</small>":"")+'</span><span class="v">'+fm(x.paid)+(x.missing?" <small>sur "+fm(x.due)+"</small>":"")+"</span></div>").join("");
  if(lines)h+='<details class="more"><summary>Détail</summary><div class="fin-lines">'+lines+"</div></details>";
  return h+"</div></div>";
}
function finSurplus(r){
  const s=r.steps[4];

async function finAct(b){
  const a=b.dataset.fin,id=b.dataset.id,r=FIN.data;if(!r)return;
  if(a==="prev"||a==="next")return go("finances",finShift(r.month,a==="prev"?-1:1));
  if(a==="now")return go("finances");
  if(a==="settings")return finSettingsModal(r);
  if(a==="expense")return finExpenseModal(r);
  if(a==="payout")return finPayoutModal(r);
  if(a==="debt")return finDebtModal(r);
  if(a==="income")return finIncomeModal();
  if(a==="refuse")return modal("Refuser la dépense",'<label class="f">Raison (facultatif)</label><input type="text" name="reason" maxlength="300" placeholder="Pas ce mois-ci">',"Refuser",
    async fd=>{await api("POST",API+"/finances/expenses/"+id+"/refuse",{reason:fv(fd,"reason")});toast("Dépense refusée.");render()});
  const c={approve:["POST","/expenses/"+id+"/approve","Accord enregistré."],validate:["POST","/expenses/"+id+"/validate","Dépense validée."],
    "payout-cancel":["DELETE","/payouts/"+id,"Versement annulé.","Annuler ce versement ? Il ne comptera plus."],
    "debt-cancel":["DELETE","/debt/payments/"+id,"Remboursement annulé.","Annuler ce remboursement ? Le solde de la dette remontera."],
    "income-cancel":["DELETE","/incomes/"+id,"Revenu annulé.","Annuler ce revenu ? Il ne comptera plus dans la marge."]}[a];
  if(!c||(c[3]&&!confirm(c[3])))return;
  b.disabled=true;
  try{const res=await api(c[0],API+"/finances"+c[1]);toast(a==="approve"&&res.expense&&res.expense.status==="validee"?"Tout le monde est d'accord : dépense validée.":c[2]);render()}
  catch(e){fail(e);b.disabled=false}
}

function spark(cs,k){const W=480,H=70,P=6,vals=cs.map(c=>c.value).concat([k.target_value,k.start_value]),mn=Math.min(...vals),mx=Math.max(...vals)||1,
  x=i=>P+(W-2*P)*(cs.length===1?1:i/(cs.length-1)),y=v=>H-P-(H-2*P)*((v-mn)/((mx-mn)||1));
  return '<svg class="chart" viewBox="0 0 '+W+" "+H+'" style="margin-bottom:6px" aria-hidden="true"><line x1="0" x2="'+W+'" y1="'+y(k.target_value)+'" y2="'+y(k.target_value)+'" stroke="var(--ok)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--primary)" stroke-width="2" points="'+cs.map((c,i)=>x(i)+","+y(c.value)).join(" ")+'"/></svg>'}

/* Mentions : suggestions quand on tape @ */
function mentionAssist(el){if(!el)return;let box=null,idx=0,items=[];
  const close=()=>{if(box){box.remove();box=null}};
  el.addEventListener("input",()=>{const pos=el.selectionStart,before=el.value.slice(0,pos),m=before.match(/(^|\s)@([A-Za-z0-9_.\-]{0,40})$/);
    if(!m){close();return}const q=m[2].toLowerCase();items=S.members.filter(x=>x.username.toLowerCase().includes(q)||x.display_name.toLowerCase().includes(q)).slice(0,6);
    if(!items.length){close();return}idx=0;if(!box){box=document.createElement("div");box.className="suggest";document.body.appendChild(box)}
    const r=el.getBoundingClientRect();box.style.left=(r.left+window.scrollX+8)+"px";box.style.top=(r.bottom+window.scrollY+4)+"px";draw()});
  function draw(){box.innerHTML=items.map((x,i)=>'<div class="'+(i===idx?"on":"")+'" data-u="'+esc(x.username)+'">'+av(x.username)+" "+esc(x.display_name)+' <span class="faint">@'+esc(x.username)+"</span></div>").join("");
    $$("[data-u]",box).forEach(d=>d.onmousedown=ev=>{ev.preventDefault();pick(d.dataset.u)})}
  function pick(u){const pos=el.selectionStart,before=el.value.slice(0,pos).replace(/@([A-Za-z0-9_.\-]{0,40})$/,"@"+u+" ");el.value=before+el.value.slice(pos);el.selectionStart=el.selectionEnd=before.length;close();el.focus()}
  el.addEventListener("keydown",e=>{if(!box)return;if(e.key==="ArrowDown"){e.preventDefault();idx=(idx+1)%items.length;draw()}else if(e.key==="ArrowUp"){e.preventDefault();idx=(idx-1+items.length)%items.length;draw()}
    else if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();e.stopPropagation();pick(items[idx].username)}else if(e.key==="Escape"){e.stopPropagation();close()}});
  el.addEventListener("blur",()=>setTimeout(close,150));
}

  }catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+"</div>"}};
$("#notifs").addEventListener("click",async e=>{
  if(e.target.closest("[data-read-all]")){try{await api("POST",API+"/notifications/read",{all:true});S.unread=0;bell();$$(".ntf.unread").forEach(x=>x.classList.remove("unread"))}catch(err){fail(err)}return}
  const n=e.target.closest("[data-n]");if(!n)return;
  if(n.classList.contains("unread")){api("POST",API+"/notifications/read",{ids:[n.dataset.n]}).then(()=>{S.unread=Math.max(0,S.unread-1);bell()}).catch(()=>{});n.classList.remove("unread")}
  if(n.dataset.nt){$("#notifs").hidden=true;openTask(n.dataset.nt)}
});
document.addEventListener("click",e=>{const el=$("#notifs");if(!el.hidden&&!e.target.closest("#notifs")&&!e.target.closest("#bell"))el.hidden=true});

/* ── palette de commandes ──────────────────────────────────── */
let pal=[],palIdx=0;
function openPalette(){$("#palette").hidden=false;$("#pal-in").value="";palIdx=0;drawPalette();$("#pal-in").focus()}
function closePalette(){$("#palette").hidden=true}
function drawPalette(){
  const q=$("#pal-in").value.trim().toLowerCase();const items=[];
  if(canEdit()){items.push({ic:"+",l:"Nouvelle tâche",run:()=>taskModal()},{ic:"+",l:"Nouveau projet",run:()=>projectModal()},{ic:"+",l:"Nouveau document",run:()=>docModal(null,null)},{ic:"✦",l:"Partir d'un modèle",run:()=>templatesModal()})}
  VIEWS.forEach(([k,l,ic])=>items.push({ic,l:"Aller à : "+l,run:()=>go(k)}));
  S.projects.forEach(p=>items.push({ic:"■",l:"Projet : "+(p.icon?p.icon+" ":"")+p.name,run:()=>go("project",p.id)}));
  items.push({ic:"◐",l:"Changer de thème",run:cycleTheme},{ic:"?",l:"Raccourcis clavier",run:shortcutsModal});
  let res=q?items.filter(i=>i.l.toLowerCase().includes(q)):items.slice(0,12);
  if(q){const n=q.replace(/^#|^[a-z]+-/,"");tasks().filter(t=>t.title.toLowerCase().includes(q)||String(t.number)===n).sort((a,b)=>open(b)-open(a)||b.number-a.number).slice(0,12)
    .forEach(t=>res.push({ic:keyOf(t),l:t.title,run:()=>openTask(t.id)}))}
  pal=res.slice(0,30);palIdx=Math.min(palIdx,Math.max(0,pal.length-1));
  $("#pal-list").innerHTML=pal.length?pal.map((i,k)=>'<li class="'+(k===palIdx?"on":"")+'" data-k="'+k+'"><span class="num" style="min-width:34px">'+esc(i.ic)+"</span>"+esc(i.l)+"</li>").join(""):'<li class="muted">Aucun résultat</li>';
}
$("#pal-in").addEventListener("input",()=>{palIdx=0;drawPalette()});
$("#pal-in").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();palIdx=Math.min(pal.length-1,palIdx+1);drawPalette()}else if(e.key==="ArrowUp"){e.preventDefault();palIdx=Math.max(0,palIdx-1);drawPalette()}
  else if(e.key==="Enter"){e.preventDefault();const i=pal[palIdx];closePalette();if(i)i.run()}else if(e.key==="Escape")closePalette()});
$("#pal-list").addEventListener("click",e=>{const li=e.target.closest("[data-k]");if(!li)return;const i=pal[Number(li.dataset.k)];closePalette();if(i)i.run()});
$("#palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette()});
$("#new-task-btn").onclick=()=>taskModal();

/* ── clavier ───────────────────────────────────────────────── */
let gPending=false,gTimer=null;
document.addEventListener("keydown",e=>{
  if($("#app").hidden)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();return $("#palette").hidden?openPalette():closePalette()}
  if(e.key==="Escape"){if(!$("#palette").hidden)return closePalette();if(!$("#modal").hidden)return closeModal();if(!$("#drawer").hidden)return closeDrawer();if(!$("#notifs").hidden)return $("#notifs").hidden=true;return}
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(!$("#modal").hidden||!$("#palette").hidden)return;
  if(gPending){gPending=false;clearTimeout(gTimer);const v=VIEWS.find(x=>x[3]===e.key.toLowerCase());if(v){e.preventDefault();go(v[0])}return}
  if(e.key==="g"){gPending=true;gTimer=setTimeout(()=>gPending=false,1200);return}
  if(e.key==="n"&&canEdit()){e.preventDefault();taskModal()}
  else if(e.key==="/"){e.preventDefault();$("#search").focus()}
  else if(e.key==="?"){e.preventDefault();shortcutsModal()}
});

/* ── thème ─────────────────────────────────────────────────── */
function applyTheme(t){if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}
function cycleTheme(){const cur=store("ws_theme")||"auto";const next=cur==="auto"?"dark":cur==="dark"?"light":"auto";store("ws_theme",next);applyTheme(next);toast("Thème : "+({auto:"automatique",dark:"sombre",light:"clair"}[next]))}
$("#theme-btn").onclick=cycleTheme;
$("#theme-btn").innerHTML=ic("theme",17);$("#logout-btn").innerHTML=ic("logout",17);$("#menu-btn").innerHTML=ic("menu",18);
$("#bell").insertAdjacentHTML("afterbegin",ic("bell",18));
applyTheme(store("ws_theme")||"auto");
S.list.group=store("ws_group")||"status";
S.moreNav=store("ws_more")==="1";

boot();
</script>
</body>
