<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ app_name }}</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F2F4F7; --border:#E4E7EC; --ink:#101828; --muted:#475467; --faint:#98A2B3;
  --primary:#0B6FA4; --primary-ink:#FFFFFF; --primary-soft:#E7F2FA; --accent:#E0A500;
  --danger:#C0362C; --danger-soft:#FDEDEB; --ok:#1E7A45; --ok-soft:#E6F4EB; --warn:#9A6200; --warn-soft:#FFF4DB;
  --ai:#7C3AED; --ai-soft:#F4EFFF; --ai-grad:linear-gradient(135deg,#8B5CF6,#4F46E5);
  --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 12px 32px rgba(16,24,40,.14); --r:12px; --r-sm:8px;
  --s-a_faire:#98A2B3; --s-en_cours:#0B8BD0; --s-en_revue:#7C3AED; --s-bloque:#C0362C; --s-fait:#1E9E57;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111A; --surface:#121A26; --surface-2:#18222F; --border:#243042; --ink:#E6EBF2; --muted:#A3B0C2; --faint:#6F7E93;
    --primary:#4DB3EA; --primary-ink:#06121E; --primary-soft:#13304A; --accent:#FFC94D;
    --danger:#F59A92; --danger-soft:#3A1E21; --ok:#7AD49C; --ok-soft:#173526; --warn:#F5C36B; --warn-soft:#3A2E14;
    --ai:#B69CFF; --ai-soft:#231B3D;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
    --s-a_faire:#6F7E93; --s-en_cours:#4DB3EA; --s-en_revue:#B69CFF; --s-bloque:#F59A92; --s-fait:#7AD49C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111A; --surface:#121A26; --surface-2:#18222F; --border:#243042; --ink:#E6EBF2; --muted:#A3B0C2; --faint:#6F7E93;
  --primary:#4DB3EA; --primary-ink:#06121E; --primary-soft:#13304A; --accent:#FFC94D;
  --danger:#F59A92; --danger-soft:#3A1E21; --ok:#7AD49C; --ok-soft:#173526; --warn:#F5C36B; --warn-soft:#3A2E14;
  --ai:#B69CFF; --ai-soft:#231B3D;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
  --s-a_faire:#6F7E93; --s-en_cours:#4DB3EA; --s-en_revue:#B69CFF; --s-bloque:#F59A92; --s-fait:#7AD49C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{flex:none;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 8px;min-height:28px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;border-radius:var(--r-sm);width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=number],input[type=url],input[type=tel],select,textarea{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;min-height:34px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.pill.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;text-transform:uppercase}
.avatar.lg{width:40px;height:40px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--primary)}
.bar.ok>i{background:var(--ok)}
kbd{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}

/* Connexion */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
#login .card{width:100%;max-width:380px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1CB0F6,#0B6FA4);display:grid;place-items:center;color:#fff;font-weight:900}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

/* Application */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;height:100dvh}
#side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#side .brand{padding:16px 16px 10px}
#side nav{padding:4px 8px;overflow:auto;flex:1}
.nav-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:14px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;text-align:left;color:var(--ink)}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-i .ic{width:18px;text-align:center;flex:none}
.nav-i .n{margin-left:auto;font-size:12px;color:var(--faint)}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
#top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search{max-width:280px}
#menu-btn{display:none}
#filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
#filters select{width:auto;min-height:30px;padding:3px 8px;font-size:13px}
#filters label{font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
#view{flex:1;overflow:auto;padding:16px;min-height:0}
.badge{position:absolute;top:3px;right:3px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* Simplicité : sections repliables, choix segmentés */
.more>summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;list-style:none;padding:8px 0}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸ "}.more[open]>summary::before{content:"▾ "}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin-right:4px}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-weight:600;color:var(--muted);min-height:30px}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.nav-toggle{width:100%;border:0;background:transparent;cursor:pointer;text-align:left;margin-top:6px}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 2px}
.grp:first-child{margin-top:0}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.mail{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:#fff;color:#14233A;max-height:60vh;overflow:auto}

/* Accueil */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{padding:14px}
.tile .v{font-size:26px;font-weight:800;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{padding:14px 16px}
.sec h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.line{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--r-sm);cursor:pointer;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:0}
.line:hover{background:var(--surface-2)}
.line .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:18px;height:18px;border:2px solid var(--faint);border-radius:5px;display:inline-grid;place-items:center;cursor:pointer;flex:none;background:transparent;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on::after{content:"✓";font-size:12px;font-weight:900}
.done-t{text-decoration:line-through;color:var(--faint)}

/* Tableau */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:12px;align-items:start;min-height:100%}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;max-height:100%;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:13px}
.col-h .n{color:var(--faint);font-weight:600}
.col-b{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px}
.col.over{outline:2px dashed var(--primary);outline-offset:-4px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px 8px;cursor:pointer;border-left:4px solid var(--pc,#0B6FA4);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tcard:hover{border-color:var(--primary);border-left-color:var(--pc,#0B6FA4)}
.tcard.drag{opacity:.4}
.tcard .tt{font-weight:600;margin:2px 0 6px;word-break:break-word}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tcard .meta .sp{margin-left:auto}
.num{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--faint)}
.lbl{font-size:11px;border-radius:4px;padding:0 6px;background:var(--primary-soft);color:var(--primary)}
.prio{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px}
.prio.urgente{background:var(--danger-soft);color:var(--danger)}
.prio.haute{background:var(--warn-soft);color:var(--warn)}
.prio.basse{color:var(--faint)}
.due.late{color:var(--danger);font-weight:700}
.due.soon{color:var(--warn);font-weight:600}
.add-in-col{border:1px dashed var(--border);background:transparent;border-radius:var(--r-sm);padding:6px;color:var(--muted);cursor:pointer;text-align:left}
.add-in-col:hover{color:var(--primary);border-color:var(--primary)}

/* Liste */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbl th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td select,.tbl td input[type=date]{min-height:28px;padding:2px 6px;font-size:13px;width:auto;max-width:150px}
.tbl .tcell{cursor:pointer;font-weight:600;min-width:220px}
.grp-h td{background:var(--bg)!important;font-weight:700;font-size:13px}
.bulk{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;background:var(--primary-soft);border:1px solid var(--primary);border-radius:var(--r)}
.bulk select,.bulk input{width:auto;min-height:30px;padding:2px 8px;font-size:13px}
.tablewrap{overflow:auto}

/* Calendrier */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{margin:0;font-size:16px;min-width:170px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--border);gap:1px}
.cal .dow{background:var(--surface-2);padding:6px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.cal .day{background:var(--surface);min-height:108px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cal .day.out{background:var(--surface-2)}
.cal .day.today .dn{background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:0 7px}
.cal .day.over{outline:2px dashed var(--primary);outline-offset:-3px}
.cal .dn{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start}
.chip{font-size:12px;border-radius:4px;padding:2px 6px;background:var(--surface-2);border-left:3px solid var(--pc,#0B6FA4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.fait{opacity:.55;text-decoration:line-through}

/* Chronologie */
.tl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:auto}
.tl-in{min-width:900px;position:relative}
.tl-row{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--border);min-height:30px}
.tl-row:last-child{border-bottom:0}
.tl-name{padding:5px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border);cursor:pointer}
.tl-name.proj{font-weight:700;background:var(--surface-2);cursor:default}
.tl-track{position:relative}
.tl-bar{position:absolute;top:6px;height:18px;border-radius:5px;background:var(--pc,#0B6FA4);opacity:.85;cursor:pointer;min-width:8px}
.tl-bar.fait{opacity:.35}
.tl-head{display:grid;grid-template-columns:240px 1fr;position:sticky;top:0;background:var(--surface-2);z-index:2;border-bottom:1px solid var(--border)}
.tl-weeks{position:relative;height:28px}
.tl-weeks span{position:absolute;top:6px;font-size:11px;color:var(--muted);font-weight:600;padding-left:4px;border-left:1px solid var(--border);height:22px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1;pointer-events:none}

/* Objectifs */
.goal{padding:16px;margin-bottom:14px}
.goal-h{display:flex;align-items:flex-start;gap:12px}
.ring{width:52px;height:52px;flex:none}
.kr{display:grid;grid-template-columns:1fr 160px auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.kr .v{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}

/* Équipe */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.person{padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--muted)}

/* Documents */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{padding:14px;cursor:pointer}
.doc:hover{border-color:var(--primary)}
.doc h3{margin:6px 0 4px;font-size:15px}
.md{line-height:1.6;word-break:break-word}
.md h1,.md h2,.md h3{margin:1em 0 .4em;line-height:1.25}
.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md p{margin:.5em 0}
.md ul,.md ol{padding-left:22px;margin:.4em 0}
.md code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.md blockquote{margin:.5em 0;padding:4px 12px;border-left:3px solid var(--border);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.mention{background:var(--primary-soft);color:var(--primary);border-radius:4px;padding:0 3px;font-weight:600}

/* Rapports */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.report{white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;max-height:420px;overflow:auto}

/* Tiroir de tâche */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:40;display:flex;flex-direction:column}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
#drawer .db{overflow:auto;padding:14px 18px 40px;flex:1}
.title-in{font-size:19px;font-weight:700;border:1px solid transparent!important;padding:6px 8px!important;background:transparent!important;resize:none;min-height:0!important;line-height:1.3;overflow:hidden}
.title-in:hover,.title-in:focus{border-color:var(--border)!important;background:var(--surface)!important}
.props{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center;margin:10px 0 6px}
.props>span{font-size:12px;font-weight:600;color:var(--muted)}
.props select,.props input{min-height:30px;padding:3px 8px}
.dsec{margin-top:18px}
.dsec h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0}
.ck .x{opacity:0}
.ck:hover .x{opacity:1}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.cmt .who{font-weight:700;font-size:13px}
.act{font-size:12px;color:var(--muted);padding:3px 0}
.scrim{position:fixed;inset:0;background:rgba(10,18,30,.42);z-index:39}

/* Fenêtres */
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,18,30,.5)}
#modal .card{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#modal h2{margin:0 0 6px;font-size:18px}
#modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#palette{position:fixed;inset:0;z-index:70;background:rgba(10,18,30,.5);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
#palette .card{width:100%;max-width:600px;overflow:hidden}
#palette input{border:0;border-bottom:1px solid var(--border);border-radius:0;font-size:16px;padding:14px 16px;min-height:50px}
#palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#palette li{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;display:flex;gap:10px;align-items:center}
#palette li.on{background:var(--primary-soft);color:var(--primary)}
#notifs{position:fixed;top:56px;right:12px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;z-index:50;padding:6px}
.ntf{padding:10px;border-radius:var(--r-sm);cursor:pointer;display:flex;gap:10px}
.ntf:hover{background:var(--surface-2)}
.ntf.unread{background:var(--primary-soft)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.err{background:var(--danger);color:#fff}
.suggest{position:absolute;z-index:65;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow);min-width:180px;padding:4px}
.suggest div{padding:6px 8px;border-radius:4px;cursor:pointer}
.suggest div.on,.suggest div:hover{background:var(--primary-soft)}
.preview{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.ph{padding:16px;margin-bottom:14px}
.ph-h{display:flex;align-items:flex-start;gap:12px}
.ph-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex:none}

/* ── Finition : moins de cadres, plus d'air ───────────────────── */
.btn{border-radius:var(--r-sm);font-weight:500}
.btn.primary{box-shadow:0 1px 2px rgba(11,111,164,.25)}
.icon-btn{border-radius:var(--r-sm)}
#side{background:var(--surface)}
#side .brand{padding:18px 18px 12px;font-size:16px}
.brand small{font-weight:600;color:var(--faint);font-size:13px;margin-left:-4px}
.brand-mark{width:28px;height:28px;border-radius:8px;font-size:14px}
.nav-i{padding:7px 10px;color:var(--muted);font-weight:500;min-height:34px}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav-i.on .ic{color:var(--primary)}
.nav-i .ic{width:18px;display:grid;place-items:center;color:var(--faint)}
#top{padding:10px 20px;min-height:58px}
#top h1{font-size:16px;font-weight:650}
#search{border-radius:999px;background:var(--surface-2);border-color:transparent;padding-left:14px}
#search:focus{background:var(--surface);border-color:var(--border)}
#filters{padding:8px 20px}
#view{padding:20px}
.card{border-radius:var(--r)}
.sec{padding:16px 18px}
.sec h2{font-size:14px;font-weight:650;letter-spacing:.1px}
.sec h2 a{font-weight:500;text-decoration:none}
.line{border-bottom:0;border-radius:var(--r-sm);padding:7px 8px}
.line+.line{box-shadow:inset 0 1px 0 var(--surface-2)}
.grp{color:var(--faint);margin:14px 0 4px 8px}
.si{flex:none;display:block}
.avatar.ai{background:var(--ai-grad)!important}
.avatar.ai svg{width:60%;height:60%}
.accts{display:grid;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px}
.acct{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.acct:hover{background:var(--surface-2)}
.acct.in{cursor:default;opacity:.65}
.acct input{width:auto;min-height:0;margin:0}
.dec-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;white-space:nowrap;flex:none}
.banner.dec{background:var(--warn-soft);color:var(--warn)}
.ai-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:999px;padding:1px 7px 1px 5px}
.gh{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.gh.fusionnee{color:var(--ai)} .gh.ouverte{color:var(--ok)} .gh.fermee{color:var(--faint)}
.key{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--faint);letter-spacing:.2px}

/* Accueil */
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.3px}
.kpis{display:flex;gap:0;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kpi{padding:8px 16px;min-width:96px;cursor:pointer;border:0;background:transparent;text-align:left}
.kpi+.kpi{border-left:1px solid var(--border)}
.kpi:hover{background:var(--surface-2)}
.kpi b{display:block;font-size:20px;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.feed-i{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;font-size:13px}
.feed-i .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.feed-i .ic.ai{background:var(--ai-soft);color:var(--ai)}
.who-row .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tableau */
.col{background:var(--surface-2);border-color:transparent;border-radius:var(--r)}
.col-h{padding:12px 12px 8px;font-weight:650}
.tcard{border-left:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.tcard:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));border-left-color:color-mix(in srgb,var(--primary) 45%,var(--border));box-shadow:0 4px 14px rgba(16,24,40,.08)}
.tcard.ai{background:linear-gradient(180deg,var(--ai-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--ai) 30%,var(--border))}
.tcard .tt{margin:4px 0 8px;line-height:1.35}
.tcard .meta{gap:8px}
.tcard .meta:first-child{flex-wrap:nowrap}
.tcard .meta:first-child .pj{display:flex;flex:0 1 auto;min-width:0;max-width:none}
.tcard .pj>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key,.prio{white-space:nowrap;flex:none}
.tcard .pj{display:inline-flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:150px}
.add-in-col{border:0;background:transparent}
.add-in-col:hover{background:var(--surface)}
.prio{display:inline-flex;align-items:center;gap:2px}

/* Tiroir */
#drawer{width:min(620px,100vw);box-shadow:var(--shadow-lg)}
#drawer .db{padding:16px 22px 40px}
.title-in{font-size:20px;letter-spacing:-.2px}
.props{grid-template-columns:118px 1fr;gap:2px 8px;margin:6px 0 4px}
.props>span{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted);font-size:13px}
.props select,.props input{border-color:transparent;background:transparent;min-height:32px;cursor:pointer;width:auto;max-width:100%}
.props select:hover,.props input:hover{background:var(--surface-2)}
.props select:focus,.props input:focus{border-color:var(--border);background:var(--surface)}
.props .with-ic{display:flex;align-items:center;gap:6px}
.dsec h3{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--faint)}
.banner{display:flex;gap:10px;align-items:center;border-radius:var(--r-sm);padding:9px 12px;margin:8px 0 6px;font-size:13px}
.banner.ai{background:var(--ai-soft);color:var(--ai)}
.banner b{color:var(--ink)}
.gh-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.gh-row a{color:var(--ink);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-row a:hover{text-decoration:underline}
.copy-row{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:var(--r-sm);padding:5px 6px 5px 10px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:6px}
.copy-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrn{border-left:2px solid var(--ai);padding:4px 0 4px 10px;margin:6px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}

/* Automatisations (Équipe) */
.auto{display:grid;gap:0}
.auto-row{display:flex;align-items:center;gap:12px;padding:12px 2px;flex-wrap:wrap}
.auto-row+.auto-row{border-top:1px solid var(--border)}
.auto-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.auto-ic.ai{background:var(--ai-grad);color:#fff}
.auto-row .grow b{display:block}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.steps code{font-size:12px}
.person.ai{background:linear-gradient(180deg,var(--ai-soft),var(--surface) 60%);border-color:color-mix(in srgb,var(--ai) 30%,var(--border))}


/* ── HandyPay : ventes, relances, tableau du soir ─────────────── */
.brand-mark{background:linear-gradient(135deg,#12B76A,#0E7C66)}
.daynav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.daynav input[type=date]{width:auto;min-height:30px;padding:3px 8px}
.closer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.qty input{width:56px;text-align:center;border:0;border-radius:0;font-size:18px;font-weight:700;min-height:44px;padding:0;-moz-appearance:textfield;appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qbtn{border:0;background:var(--surface-2);width:44px;height:44px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.qbtn:hover{background:var(--primary-soft)}
.btn.big{font-size:17px;padding:10px 22px;min-height:46px;border-radius:999px}
.tile .v small{font-size:15px;font-weight:600;color:var(--muted)}
.tile .bar{margin-top:8px}
.tile .small{margin-top:6px}
.tiles.t6{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.rank{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:var(--r-sm)}
.rank.me{background:var(--primary-soft)}
.rank .rk{width:18px;text-align:right;color:var(--faint);font-weight:700;font-size:12px;flex:none}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{flex:0 1 120px;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.rank .rc{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.line.sale{cursor:default;flex-wrap:wrap}
.line.sale .t{white-space:normal;flex:1 1 200px}
a.btn{text-decoration:none}
.line.sale .t small{display:block;font-size:12px;color:var(--muted)}
.line.sale.off{opacity:.55}
.btn.danger-t{color:var(--danger)}
.btn.ok-t{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--border))}
.btn.wa{background:#25D366;border-color:#25D366;color:#053B1D;font-weight:700;text-decoration:none}
.btn.wa:hover{filter:brightness(1.05);background:#25D366}
.fo-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fo-top .tabs{margin:0;border:0;flex-wrap:wrap}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-size:11px;margin-left:4px;text-align:center}
.cnt:empty{display:none}
.fo-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fo-filters select,.fo-filters input{width:auto;min-height:32px;padding:3px 8px;font-size:13px}
.fo-filters input{flex:1 1 180px}
.fo{padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.fo.done{opacity:.7}
.fo-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fo-name{border:0;background:transparent;padding:0;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-align:left;min-width:0;overflow-wrap:anywhere}
.fo-name:hover{color:var(--primary)}
.fo-tel{font-variant-numeric:tabular-nums;color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.fo-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fo-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fo-act select{width:auto;flex:1 1 170px;min-height:34px;max-width:260px}
.pager{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0}
.ptable{display:grid}
.prow{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr));gap:8px;align-items:center;padding:8px 4px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.prow.ph{border-top:0;font-size:12px;color:var(--muted);font-weight:600}
.prow .pn{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.said{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.said:first-of-type{border-top:0}
.said ol{margin:4px 0;padding-left:18px}
.report-box{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.report-box ul{margin:6px 0 0;padding-left:18px}
.tpl-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.tpl-body{white-space:pre-wrap;margin-top:4px}
.copy-row.pw span{font-size:16px;font-weight:700;letter-spacing:.5px}
.home-camp{margin-bottom:16px}
@media (max-width:700px){
  .grid2.eq{grid-template-columns:minmax(0,1fr)}
  .line.sale{row-gap:4px;column-gap:6px}
  .line.sale .btn.sm{padding:3px 7px}
  .rbar{flex-basis:64px}
  .line.sale .t{flex-basis:calc(100% - 44px)}
  .line.sale>.t~*:nth-child(3){margin-left:34px}
  .tiles.t6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow.ph{display:none}
  .prow{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:2px}
  .prow .pn{grid-column:1/-1;font-weight:600}
  .prow span[data-l]::before{content:attr(data-l);display:block;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.3px}
}
@media (max-width:520px){
  .tiles{gap:8px}
  .tile{padding:12px}
  .tile .v{font-size:20px}
  .tile .v small{font-size:12px}
  .closer{padding:12px}
  .closer .btn.big{flex:1 1 auto;justify-content:center;padding:10px 14px}
  .closer .btn.ghost{flex:1 1 100%;justify-content:center}
  .fo-act .btn.wa{flex:1 1 100%;justify-content:center}
  .fo-act select{flex:1 1 100%;max-width:none}
  .fo-act .btn.sm{flex:1 1 auto;justify-content:center}
  .fo-top .tabs{flex:1 1 100%}
  .fo-top .tabs button{flex:1 1 auto}
  .fo-top>.grow{display:none}
  .fo-top>.btn,.fo-top>a.btn{flex:1 1 auto;justify-content:center}
}

/* ==== FINANCES ==== */
input[type=month]{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;min-height:34px;width:100%}
.fin-nav input[type=month]{width:auto;min-height:30px;padding:3px 8px}
.fin-note{padding:12px 14px;border-radius:var(--r);margin-bottom:14px;background:var(--surface);border:1px solid var(--border);line-height:1.5}
.fin-note.ok{background:var(--ok-soft);border-color:transparent}
.fin-note.warn{background:var(--warn-soft);border-color:transparent}
.fin-split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:2px 0 8px}
.fin-split i{display:block;height:100%;min-width:2px}
.fin-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.fin-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fin-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fin-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;padding:14px 0 12px;border-top:1px solid var(--border)}
.fin-rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted)}
.fin-step.ok .fin-rk{background:var(--ok-soft);color:var(--ok)}
.fin-step.short .fin-rk{background:var(--danger-soft);color:var(--danger)}
.fin-sh{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.fin-sh b{font-size:15px}
.fin-amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.fin-amt small{font-weight:500;color:var(--muted);font-size:13px}
.fin-ex{font-size:13px;color:var(--muted);margin:2px 0 8px}
.fin-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.fin-bar i{display:block;height:100%}
.fin-bar .p{background:var(--ok)}
.fin-bar .m{background:repeating-linear-gradient(135deg,var(--danger-soft) 0 5px,color-mix(in srgb,var(--danger) 45%,transparent) 5px 8px)}
.fin-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fin-step details.more{margin-top:2px}
.fin-step details.more>summary{padding:6px 0 2px}
.fin-lines{font-size:13px}
.fin-lines>div{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--border)}
.fin-lines .v{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.fin-lines small{color:var(--muted)}
.fin-sec2{margin-top:16px}
.fin-pt{display:grid}
.fin-pr{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,1fr));gap:8px;align-items:center;padding:9px 4px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.fin-pr.h{border-top:0;font-size:12px;color:var(--muted);font-weight:600}
.fin-pr>span:not(.pn){text-align:right}
.fin-pr.h>span:first-child{text-align:left}
.fin-sub{font-weight:500}
.fin-pr .pn{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-pr small{display:block;font-size:11px;color:var(--muted)}
.fin-pr.tot{font-weight:700;border-top:2px solid var(--border)}
.fin-left{color:var(--warn);font-weight:700}
.fin-zero{color:var(--ok)}
.fin-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 2px;border-top:1px solid var(--border)}
.fin-row .t{flex:1 1 170px;min-width:0;overflow-wrap:anywhere}
.fin-row .t small{display:block;color:var(--muted);font-size:12px}
.fin-row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin-big{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:8px}
.fin-big small{font-size:13px;font-weight:500;color:var(--muted)}
.fin-votes{display:inline-flex;align-items:center;padding-left:4px}
.fin-votes .avatar{width:22px;height:22px;font-size:9px;margin-left:-4px;border:2px solid var(--surface)}
.fin-votes .off .avatar{opacity:.35;filter:grayscale(1)}
.fin-payroll{display:grid;gap:2px;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px}
.fin-pay-r{display:flex;align-items:center;gap:8px;padding:4px 6px}
.fin-pay-r label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.fin-pay-r input[type=checkbox]{width:auto;min-height:0;margin:0}
.fin-pay-r input[type=number]{width:96px;flex:none}
@media (max-width:700px){
  .fin-pr.h{display:none}
  .fin-pr{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px;align-items:start}
  .fin-sub{display:none}
  .fin-row .t{flex-basis:100%}
  .fin-pr .pn{grid-column:1/-1;font-weight:600}
  .fin-pr>span:not(.pn){text-align:left}

<script>
"use strict";
/* HandyPay · Espace d'équipe — page unique. Toutes les données passent par

const API = "/api/ws";

const STATUS = [["a_faire","À faire"],["en_cours","En cours"],["en_revue","En revue"],["bloque","Bloqué"],["fait","Fait"]];

const COLORS = ["#0B6FA4","#1CB0F6","#2F855A","#B7791F","#C53030","#6B46C1","#D53F8C","#319795","#4A5568","#DD6B20"];

// Navigation volontairement courte : quatre entrées ; le reste vit sous « Plus ».

const S = {
  me:null, members:[], projects:[], objectives:[], cycles:[], templates:[], tasks:new Map(), docs:null,

/* ── utilitaires ─────────────────────────────────────────────── */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
// « Aujourd'hui » = la date à Port-au-Prince, comme sur le serveur.
function today(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return iso(new Date())}}
function parseD(s){if(!s)return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function monday(s){const d=parseD(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
function fmtD(s){if(!s)return "";const d=parseD(s);const t=today();const n=diffDays(t,s);
  if(n===0)return "Aujourd'hui";if(n===1)return "Demain";if(n===-1)return "Hier";
  if(n>1&&n<7)return JOURS[d.getDay()]+" "+d.getDate();
  return d.getDate()+" "+MOIS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
function ago(ts){if(!ts)return "";const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<60)return "à l'instant";if(s<3600)return "il y a "+Math.floor(s/60)+" min";if(s<86400)return "il y a "+Math.floor(s/3600)+" h";
  if(s<86400*7)return "il y a "+Math.floor(s/86400)+" j";return fmtD(String(ts).slice(0,10))}
function num(v){return v==null?"":(Math.round(v*10)/10).toLocaleString("fr-FR")}
function cookie(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):""}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* ── icônes (traits simples, couleur du texte) ─────────────────── */
const ICONS={
  home:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',

  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  pr:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/><path d="m13 4.5-2.5 2.5 2.5 2.5"/>',
  commit:'<circle cx="12" cy="12" r="3.5"/><path d="M2.5 12h6M15.5 12h6"/>',
  ai:'<path fill="currentColor" stroke="none" d="M11 2.5l1.9 5.6 5.6 1.9-5.6 1.9L11 17.5l-1.9-5.6L3.5 10l5.6-1.9zM18.5 14l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/>',
  theme:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2M14 11v6M11 14h6"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  status:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  wa:'<path d="M20.5 11.6a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1.5-4.4a8.5 8.5 0 1 1 15.5-4.5z"/><path d="M9 8.8c0 3 2.6 5.9 6 6.2l1-1.6-1.9-.9-.8.8c-1-.4-2.1-1.5-2.5-2.5l.8-.8-.9-1.9z"/>',
  dusk:'<path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0M12 5v3M5.2 9.2l1.6 1.6M18.8 9.2l-1.6 1.6M2 14h2M20 14h2"/>',
};
function ic(n,s){s=s||16;return '<svg class="i" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||"")+"</svg>"}
// Statuts dessinés : cercle vide, demi, trois quarts, barré, coché.
function sIcon(s,size){size=size||14;const c="var(--s-"+s+")";
  if(s==="fait")return '<svg class="si" width="'+size+'" height="'+size+'" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="'+c+'"/><path d="M4 7.2l2 2 4-4.3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const inner={en_cours:'<path d="M7 3.5A3.5 3.5 0 0 1 7 10.5Z" fill="'+c+'"/>',en_revue:'<path d="M7 3.5A3.5 3.5 0 1 1 3.5 7L7 7Z" fill="'+c+'"/>',bloque:'<path d="M4.6 7h4.8" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/>'}[s]||"";
  return '<svg class="si" width="'+size+'" height="'+size+'" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="'+c+'" stroke-width="1.6"'+(s==="a_faire"?' stroke-dasharray="2.4 1.6"':"")+"/>"+inner+"</svg>"}
const AI="ia";
function isAI(u){return u===AI}
function keyOf(t){return (S.taskKey||"HP")+"-"+t.number}
function ghChip(t){const g=t.github||{};if(!g.pr&&!g.commits)return "";
  if(g.pr){const L={ouverte:"PR ouverte",brouillon:"Brouillon",fusionnee:"Fusionnée",fermee:"PR fermée"}[g.state]||"PR";return '<span class="gh '+esc(g.state)+'" title="'+esc(L+" #"+g.pr)+'">'+ic("pr",13)+"#"+g.pr+"</span>"}
  return '<span class="gh" title="'+g.commits+' commit(s) liés">'+ic("commit",13)+g.commits+"</span>"}
// Nom de branche conseillé, mots entiers (40 caractères au plus) : même règle que le serveur.
function branchOf(t){const w=t.title.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().match(/[a-z0-9]+/g)||[];let slug="";
  for(const x of w){if((slug?slug.length+1:0)+x.length>40)break;slug+=(slug?"-":"")+x}
  return (isAI(t.assignee)?"ia/":"")+"hp-"+t.number+(slug?"-"+slug:"")}

class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}
function detailOf(d){if(!d)return "";if(typeof d.detail==="string")return d.detail;
  if(Array.isArray(d.detail)&&d.detail[0])return "Champ invalide : "+(d.detail[0].loc||[]).slice(-1)[0]+" — "+(d.detail[0].msg||"");return ""}
async function api(method,path,body){
  const opt={method,credentials:"same-origin",headers:{"Accept":"application/json"}};
  if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  if(method!=="GET")opt.headers["X-CSRF-Token"]=cookie("hp_csrf");
  let res;try{res=await fetch(path,opt)}catch(e){throw new ApiError(0,"Réseau injoignable. Vérifie ta connexion.")}
  let data=null;if((res.headers.get("content-type")||"").includes("json"))data=await res.json().catch(()=>null);
  if(res.status===401&&!path.endsWith("/auth/login")){stopPolling();showLogin();throw new ApiError(401,"Session expirée : reconnecte-toi.")}
  if(!res.ok)throw new ApiError(res.status,detailOf(data)||("Erreur "+res.status));
  return data;
}
function toast(msg,kind,action){
  const el=document.createElement("div");el.className="toast"+(kind==="err"?" err":"");
  el.innerHTML="<span>"+esc(msg)+"</span>";
  if(action){const b=document.createElement("button");b.className="btn sm";b.textContent=action.label;b.onclick=()=>{action.run();el.remove()};el.appendChild(b)}
  $("#toast").appendChild(el);setTimeout(()=>el.remove(),action?7000:4200);
}
function fail(e){if(e&&e.status===401)return;toast(e&&e.message?e.message:"Action impossible.","err")}

/* ── mise en forme légère (titres, listes, gras, liens http(s)) ── */
function inl(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/(^|[\s(])@([A-Za-z0-9_.\-]{2,80})/g,'$1<span class="mention">@$2</span>');
}
function md(src){
  const L=esc(src||"").split("\n");let out=[],list=null,para=[];
  const flushP=()=>{if(para.length){out.push("<p>"+inl(para.join("<br>"))+"</p>");para=[]}};
  const flushL=()=>{if(list){out.push("</"+list+">");list=null}};
  for(const raw of L){const l=raw.trimEnd();let m;
    if(!l.trim()){flushP();flushL();continue}
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){flushP();flushL();out.push("<h"+m[1].length+">"+inl(m[2])+"</h"+m[1].length+">");continue}
    if(/^---+$/.test(l)){flushP();flushL();out.push("<hr>");continue}
    if((m=l.match(/^&gt;\s?(.*)$/))){flushP();flushL();out.push("<blockquote>"+inl(m[1])+"</blockquote>");continue}
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){flushP();if(list!=="ul"){flushL();out.push("<ul>");list="ul"}
      out.push("<li>"+(m[1]===" "?"☐ ":"☑ ")+inl(m[2])+"</li>");continue}
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){flushP();if(list!=="ul"){flushL();out.push("<ul>");list="ul"}out.push("<li>"+inl(m[1])+"</li>");continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(list!=="ol"){flushL();out.push("<ol>");list="ol"}out.push("<li>"+inl(m[1])+"</li>");continue}
    flushL();para.push(l);
  }
  flushP();flushL();return out.join("");
}

/* ── référentiels ─────────────────────────────────────────────── */
function member(u){return S.members.find(m=>m.username===u)}
function nameOf(u){if(!u)return "Personne";if(u==="github")return "GitHub";const m=member(u);return m?m.display_name:u}
function initials(u){const n=nameOf(u).trim().split(/\s+/);return ((n[0]||"?")[0]+(n.length>1?n[n.length-1][0]:"")).slice(0,2)}
function av(u,lg){if(!u)return '<span class="avatar'+(lg?" lg":"")+'" style="background:var(--faint)" title="Personne">–</span>';
  if(isAI(u))return '<span class="avatar ai'+(lg?" lg":"")+'" title="IA">'+ic("ai")+"</span>";
  if(u==="github")return '<span class="avatar'+(lg?" lg":"")+'" style="background:#24292F" title="GitHub">'+ic("pr",13)+"</span>";
  const m=member(u);return '<span class="avatar'+(lg?" lg":"")+'" style="background:'+esc(m?m.color:"#4A5568")+'" title="'+esc(nameOf(u))+'">'+esc(initials(u))+"</span>"}
function proj(id){return S.projects.find(p=>p.id===id)}
function cyc(id){return S.cycles.find(c=>c.id===id)}
function canEdit(){return S.me&&S.me.role!=="observateur"}
function isLead(){return S.me&&S.me.role==="responsable"}
function allKRs(){return S.objectives.flatMap(o=>o.key_results.map(k=>Object.assign({},k,{objective:o.title})))}
function curCycle(){const t=today();return S.cycles.find(c=>c.start_date<=t&&t<=c.end_date)}
function tasks(){return Array.from(S.tasks.values()).filter(t=>!t.archived&&proj(t.project_id))}
function open(t){return t.status!=="fait"}
function late(t){return open(t)&&t.due_date&&t.due_date<today()}
function labels(){const s=new Set();tasks().forEach(t=>t.labels.forEach(l=>s.add(l)));return Array.from(s).sort()}
function filtered(extra){
  const f=S.f,q=f.q.trim().toLowerCase();
  return tasks().filter(t=>{
    if(S.view==="project"&&t.project_id!==S.param)return false;
    if(f.project&&S.view!=="project"&&t.project_id!==f.project)return false;
    if(f.assignee==="__none"&&t.assignee)return false;
    if(f.assignee&&f.assignee!=="__none"&&t.assignee!==f.assignee)return false;
    if(f.priority&&t.priority!==f.priority)return false;
    if(f.label&&!t.labels.includes(f.label))return false;
    if(f.cycle==="__current"){const c=curCycle();if(!c||t.cycle_id!==c.id)return false}
    else if(f.cycle&&t.cycle_id!==f.cycle)return false;
    if(f.hideDone&&t.status==="fait")return false;
    if(q){const hay=(t.title+" "+t.description+" #"+t.number+" "+keyOf(t)+" "+t.labels.join(" ")).toLowerCase();if(!hay.includes(q))return false}
    return extra?extra(t):true;
  });
}
function dueBadge(t){if(!t.due_date)return "";const n=diffDays(today(),t.due_date);
  const cls=t.status==="fait"?"":(n<0?" late":(n<=2?" soon":""));return '<span class="due'+cls+'" style="display:inline-flex;align-items:center;gap:4px">'+ic("cal",13)+esc(fmtD(t.due_date))+"</span>"}
function prioBadge(t){return t.priority==="normale"||t.priority==="basse"?"":'<span class="prio '+t.priority+'">'+esc(PL[t.priority])+"</span>"}
function ckProgress(t){if(!t.checklist.length)return "";const d=t.checklist.filter(i=>i.done).length;return '<span title="'+(isAI(t.assignee)?"Grands points":"Étapes")+'" style="display:inline-flex;align-items:center;gap:3px">'+ic("check",13)+d+"/"+t.checklist.length+"</span>"}
function isDecision(t){return t.labels.includes("décision")}
function decTag(t){return isDecision(t)?'<span class="dec-tag" title="Décision stratégique : seule la personne en charge la valide">Décision</span>':""}
function aiTag(t){return isAI(t.assignee)?'<span class="ai-tag">'+ic("ai",11)+"IA</span>":""}

/* ── démarrage ──────────────────────────────────────────────── */
async function boot(){
  try{await api("GET","/api/auth/me")}catch(e){if(e.status!==401){showOnly("blocked");$("#blocked-msg").textContent=e.message}return}
  let b;
  try{b=await api("GET",API+"/bootstrap")}
  catch(e){if(e.status===401)return;showOnly("blocked");$("#blocked-msg").textContent=e.message;return}
  applyBootstrap(b);
  showOnly("app");
  try{const r=await api("GET",API+"/tasks");S.tasks.clear();r.tasks.forEach(t=>S.tasks.set(t.id,t));S.serverTime=r.server_time;
    if(r.truncated)toast("Beaucoup de tâches : seules les 5 000 premières sont chargées.","err")}catch(e){fail(e)}
  renderNav();route();startPolling();refreshDue();
}
function applyBootstrap(b){
  S.me=b.me;S.members=b.members;S.projects=b.projects;S.objectives=b.objectives;S.cycles=b.cycles;S.templates=b.templates;S.unread=b.unread;
  S.taskKey=b.task_key||"HP";S.github=b.github||{repo:"",connected:false};
  S.salesSettings=b.sales_settings;S.foSettings=b.followup_settings;S.foLabels=b.followup_labels;
  $("#me-av").innerHTML=av(S.me.username);$("#me-name").textContent=S.me.display_name;$("#me-role").textContent=ROLE_L[S.me.role]+(S.me.title?" · "+S.me.title:"");
  $("#new-task-btn").hidden=!canEdit();bell();
  // Filtre mémorisé devenu caduc (projet archivé, membre retiré) : sans ce
  // nettoyage, le tableau paraîtrait vide sans raison visible.
  const f=S.f;
  if(f.project&&!S.projects.some(p=>p.id===f.project))f.project="";
  if(f.assignee&&f.assignee!=="__none"&&!S.members.some(m=>m.username===f.assignee))f.assignee="";
  if(f.cycle&&f.cycle!=="__current"&&!S.cycles.some(c=>c.id===f.cycle))f.cycle="";
}
async function refreshMeta(){try{applyBootstrap(await api("GET",API+"/bootstrap"));renderNav()}catch(e){fail(e)}}
function startPolling(){stopPolling();
  S.poll=setInterval(()=>{if(!document.hidden)sync()},30000);
  S.notifPoll=setInterval(()=>{if(!document.hidden){loadUnread();refreshDue()}},60000);
}
function stopPolling(){clearInterval(S.poll);clearInterval(S.notifPoll)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.me&&!$("#app").hidden)sync()});
async function sync(){
  if(!S.serverTime)return;
  const since=new Date(new Date(S.serverTime).getTime()-10000).toISOString();
  try{const r=await api("GET",API+"/tasks?since="+encodeURIComponent(since));S.serverTime=r.server_time;
    if(r.tasks.length){r.tasks.forEach(t=>S.tasks.set(t.id,t));if(!$("#modal").hidden||document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#drawer"))renderNav();else{renderNav();if(!HP_VIEWS.has(S.view))render()}}
  }catch(e){if(e.status!==401&&e.status!==0)fail(e)}

function go(view,param){location.hash="#/"+view+(param?"/"+param:"")}
window.addEventListener("hashchange",route);
function route(){
  if($("#app").hidden)return;
  const parts=location.hash.replace(/^#\/?/,"").split("/");
  let v=parts[0]||"home",p=parts[1]||null;
  if(v==="t"){const n=Number(String(p).replace(/^[A-Za-z]+-/,""));const t=tasks().find(x=>x.number===n)||Array.from(S.tasks.values()).find(x=>x.number===n);
    if(t)openTask(t.id);else toast("Tâche "+(S.taskKey||"HP")+"-"+n+" introuvable.","err");v=S.view;p=S.param;history.replaceState(null,"","#/"+v+(p?"/"+p:""))}
  if(v==="project"&&!proj(p))v="home";
  if(!VIEWS.some(x=>x[0]===v)&&v!=="project")v="home";
  if(v!==S.view||p!==S.param)S.sel.clear();
  S.view=v;S.param=p;$("#side").classList.remove("open");renderNav();render();
}

function renderFilters(){
  const el=$("#filters"),v=S.view;if(!FILTERED.has(v)){el.hidden=true;return}
  el.hidden=false;const f=S.f;
  const opt=(val,l,cur)=>'<option value="'+esc(val)+'"'+(val===cur?" selected":"")+">"+esc(l)+"</option>";
  let h="";
  if(TASK_VIEWS.has(v))h+='<div class="seg" role="tablist">'+[["board","Tableau"],["list","Liste"],["calendar","Calendrier"]].map(([k,l])=>'<button class="'+(v===k?"on":"")+'" data-seg="'+k+'" role="tab" aria-selected="'+(v===k)+'">'+l+"</button>").join("")+"</div>";
  if(v!=="project")h+='<select data-f="project" aria-label="Projet">'+opt("","Tous les projets",f.project)+S.projects.filter(p=>p.status!=="archive").map(p=>opt(p.id,p.name,f.project)).join("")+"</select>";
  h+='<select data-f="assignee" aria-label="Personne">'+opt("","Tout le monde",f.assignee)+opt(S.me.username,"Moi",f.assignee)+opt("__none","Personne",f.assignee)+S.members.filter(m=>m.username!==S.me.username).map(m=>opt(m.username,m.display_name,f.assignee)).join("")+"</select>";
  h+='<label><input type="checkbox" data-f="hideDone"'+(f.hideDone?" checked":"")+"> Masquer les faites</label>";
  if(S.moreFilters||f.priority||f.label||f.cycle){
    h+='<select data-f="priority" aria-label="Priorité">'+opt("","Toutes priorités",f.priority)+PRIO.map(([k,l])=>opt(k,l,f.priority)).join("")+"</select>";
    const ls=labels();if(ls.length)h+='<select data-f="label" aria-label="Étiquette">'+opt("","Toutes étiquettes",f.label)+ls.map(l=>opt(l,l,f.label)).join("")+"</select>";
    if(S.cycles.length)h+='<select data-f="cycle" aria-label="Cycle">'+opt("","Tous cycles",f.cycle)+opt("__current","Cycle en cours",f.cycle)+S.cycles.map(c=>opt(c.id,c.name,f.cycle)).join("")+"</select>";
  }else h+='<button class="btn sm ghost" data-more-filters>+ Filtres</button>';
  if(f.project||f.assignee||f.priority||f.label||f.cycle||f.hideDone||f.q)h+='<button class="btn sm ghost" data-f-reset>Tout effacer</button>';
  el.innerHTML=h;
}
$("#filters").addEventListener("change",e=>{const k=e.target.dataset.f;if(!k)return;S.f[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;saveFilters();render()});

try{const saved=JSON.parse(store("ws_filters")||"null");if(saved)Object.assign(S.f,saved,{q:""})}catch(e){}

// Le fil « En direct » : ce que GitHub et l'IA ont fait, sans le bruit du reste.
async function loadLive(){
  let r;try{r=await api("GET",API+"/activity?limit=120")}catch(e){return}
  const el=$("#live");if(!el)return;
  // Les ventes ont leur propre vue : elles ne noient pas le fil du code et de l'IA.
  const items=r.activity.filter(a=>(a.action.startsWith("github_")||isAI(a.actor))&&!a.action.startsWith("sale_")).slice(0,6);
  if(!items.length)return;
  el.hidden=false;
  $("#live-b").innerHTML=items.map(a=>{const ai=isAI(a.actor),gh=a.action.startsWith("github_");
    return '<div class="feed-i"><span class="ic'+(ai?" ai":"")+'">'+ic(ai?"ai":(a.action==="github_pr"?"pr":"commit"),14)+'</span><div class="grow" style="min-width:0">'+esc(actText(a))+'<div class="small faint">'+esc(ago(a.created_at))+(gh&&!ai?" · via GitHub":"")+"</div></div></div>"}).join("");
}
function tile(v,l,c){return '<div class="card tile"><div class="v"'+(c?' style="color:'+c+'"':"")+">"+v+'</div><div class="l">'+esc(l)+"</div></div>"}
function byUrgency(a,b){const da=a.due_date||"9999",db=b.due_date||"9999";if(da!==db)return da<db?-1:1;return PRANK[a.priority]-PRANK[b.priority]||a.number-b.number}
function lineHTML(t){const p=proj(t.project_id)||{};return '<div class="line" data-task="'+esc(t.id)+'">'+(canEdit()?'<button class="chk'+(t.status==="fait"?" on":"")+'" data-done="'+esc(t.id)+'" aria-label="Marquer comme faite"></button>':"")+sIcon(t.status)+'<span class="t'+(t.status==="fait"?" done-t":"")+'">'+esc(t.title)+'</span><span class="dot" style="width:8px;height:8px;background:'+esc(p.color||"#888")+'" title="'+esc(p.name||"")+'"></span>'+aiTag(t)+decTag(t)+ghChip(t)+prioBadge(t)+dueBadge(t)+"</div>"}
async function loadFeed(){
  try{const r=await api("GET",API+"/activity?limit=15");const el=$("#feed");if(!el)return;
    el.innerHTML=r.activity.length?r.activity.map(a=>'<div class="act">'+av(a.actor)+" "+esc(actText(a))+' <span class="faint">· '+esc(ago(a.created_at))+"</span></div>").join(""):"Pas encore d'activité.";
  }catch(e){const el=$("#feed");if(el)el.textContent="Activité indisponible."}
}
function actText(a){const d=a.detail||{},who=nameOf(a.actor);
  const t=a.task_id&&S.tasks.get(a.task_id);const tt=t?"« "+t.title+" »":(d.title?"« "+d.title+" »":"une tâche");
  switch(a.action){
    case "task_created":return who+" a créé "+tt;
    case "task_updated":{const parts=[];if(d.status)parts.push("statut → "+(SL[d.status.a]||d.status.a));if(d.assignee)parts.push("confiée à "+nameOf(d.assignee.a));
      if(d.due_date)parts.push("échéance → "+(d.due_date.a?fmtD(d.due_date.a):"aucune"));if(d.priority)parts.push("priorité → "+(PL[d.priority.a]||d.priority.a));
      if(d.title)parts.push("renommée");if(d.project_id)parts.push("changée de projet");if(d.cycle_id)parts.push("cycle modifié");if(d.archived)parts.push(d.archived.a?"mise à la corbeille":"restaurée");
      return who+" a modifié "+tt+(parts.length?" : "+parts.join(", "):"")}
    case "task_recurred":return "Nouvelle occurrence de "+tt;
    case "comment_added":return who+" a commenté "+tt;
    case "project_created":return who+" a créé le projet « "+(d.name||"")+" »";
    case "project_updated":return who+" a modifié un projet";

    case "point_done":return who+" a coché « "+(d.text||"")+" » sur "+tt;
    case "sale_added":return who+" a enregistré "+(d.cards||1)+" carte"+((d.cards||1)>1?"s":"")+" closée"+((d.cards||1)>1?"s":"")+(d.origin==="handypay"?" (HandyPay)":"")+(d.username&&d.username!==a.actor?" pour "+nameOf(d.username):"");
    case "sale_cancelled":return who+" a annulé une saisie de "+(d.cards||1)+" carte(s)";
    case "sale_updated":return who+" a corrigé une vente";
    case "member_added":return who+" a ajouté "+(d.username||"")+" à l'espace";

    case "followups_exported":return who+" a exporté les fiches de relance";

    default:return who+" : "+a.action;
  }
}

function burndown(c,list){
  const days=Math.max(1,diffDays(c.start_date,c.end_date)),W=600,H=170,P=28,total=list.length;
  if(!total)return '<div class="small muted">Aucune tâche dans ce cycle.</div>';
  const x=i=>P+(W-2*P)*i/days,y=v=>H-P-(H-2*P)*v/total;
  const pts=[];const last=Math.min(days,diffDays(c.start_date,today()));
  for(let i=0;i<=last;i++){const d=addDays(c.start_date,i);const rem=list.filter(t=>!(t.status==="fait"&&(t.completed_at||"").slice(0,10)<=d)).length;pts.push(x(i)+","+y(rem))}
  return '<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Tâches restantes par jour"><line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="var(--border)"/><line x1="'+x(0)+'" y1="'+y(total)+'" x2="'+x(days)+'" y2="'+y(0)+'" stroke="var(--faint)" stroke-dasharray="4 4"/>'+
    (pts.length?'<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="'+pts.join(" ")+'"/>':"")+'<text x="'+P+'" y="'+(H-8)+'">'+esc(fmtD(c.start_date))+'</text><text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end">'+esc(fmtD(c.end_date))+'</text><text x="'+(P-6)+'" y="'+(y(total)+4)+'" text-anchor="end">'+total+"</text></svg>";
}

function weeklyText(){
  const t=today(),from=addDays(t,-7),all=tasks();
  const done=all.filter(x=>x.status==="fait"&&(x.completed_at||"").slice(0,10)>=from);
  const L=["# Point de la semaine — "+new Date().toLocaleDateString("fr-FR"),""];
  L.push("## Fait ces 7 derniers jours ("+done.length+")");
  const byM={};done.forEach(x=>{(byM[nameOf(x.assignee)]=byM[nameOf(x.assignee)]||[]).push(x)});
  Object.keys(byM).sort().forEach(n=>{L.push("- **"+n+"** : "+byM[n].map(x=>x.title+" ("+keyOf(x)+")").join(" ; "))});
  if(!done.length)L.push("- Rien de terminé.");
  const lt=all.filter(late).sort(byUrgency);L.push("","## En retard ("+lt.length+")");lt.slice(0,15).forEach(x=>L.push("- "+keyOf(x)+" "+x.title+" — "+nameOf(x.assignee)+", prévu "+fmtD(x.due_date)));
  const bl=all.filter(x=>x.status==="bloque");if(bl.length){L.push("","## Bloqué ("+bl.length+")");bl.forEach(x=>L.push("- "+keyOf(x)+" "+x.title+" — "+nameOf(x.assignee)))}
  const nx=all.filter(x=>open(x)&&x.due_date&&x.due_date>=t&&x.due_date<=addDays(t,7)).sort(byUrgency);L.push("","## À rendre dans les 7 jours ("+nx.length+")");nx.slice(0,20).forEach(x=>L.push("- "+keyOf(x)+" "+x.title+" — "+nameOf(x.assignee)+", "+fmtD(x.due_date)));
  const ob=S.objectives.filter(o=>o.status==="en_cours");if(ob.length){L.push("","## Objectifs");ob.forEach(o=>{L.push("- "+o.title+" : "+Math.round(o.progress*100)+" %");o.key_results.forEach(k=>L.push("  - "+k.title+" : "+num(k.current_value)+" / "+num(k.target_value)+" "+k.unit))})}
  return L.join("\n");
}

function intf(n){return Number(n||0).toLocaleString("fr-FR")}
function money(v,cur){return (Math.round((v||0)*100)/100).toLocaleString("fr-FR")+" "+(cur==="USD"||!cur?"$":esc(cur))}
function pctTxt(p){return p==null?"–":Math.round(p*100)+" %"}
function fmtDay(s){const d=parseD(s);return d?JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]:""}
function fmtPhone(p){const m=String(p||"").match(/^\+509(\d{4})(\d{4})$/);return m?"+509 "+m[1]+" "+m[2]:String(p||"")}
function pbar(p,cls){const w=Math.max(0,Math.min(100,Math.round((p||0)*100)));return '<div class="bar'+(cls?" "+cls:"")+'"><i style="width:'+w+'%"></i></div>'}
function hpAv(u){return u?av(u):'<span class="avatar" style="background:#0E7C66" title="HandyPay">H</span>'}
function dayNav(key,day,extra){
  return '<div class="daynav"><button class="btn sm" data-dnav="-1" data-k="'+key+'" aria-label="Jour précédent">◀</button>'+
    '<input type="date" data-dpick="'+key+'" value="'+esc(day)+'" max="'+today()+'" aria-label="Date">'+
    '<button class="btn sm" data-dnav="1" data-k="'+key+'" aria-label="Jour suivant"'+(day>=today()?" disabled":"")+'>▶</button>'+
    (day!==today()?'<button class="btn sm ghost" data-dnav="0" data-k="'+key+'">Aujourd\'hui</button>':"")+(extra||"")+"</div>"}
function tileX(l,v,extra){return '<div class="card tile"><div class="l">'+esc(l)+'</div><div class="v">'+v+"</div>"+(extra||"")+"</div>"}
async function refreshDue(){try{const r=await api("GET",API+"/followups?view=mine&limit=1");S.foDue=r.mine_due;renderNav();const el=$("#fo-due");if(el)el.textContent=S.foDue||""}catch(e){}}

/* ══ Ventes ════════════════════════════════════════════════════ */
function rankHTML(list){
  if(!list.length)return '<div class="empty">Personne pour l\'instant.</div>';
  const top=Math.max(1,...list.map(x=>x.cards));
  return list.map((x,i)=>'<div class="rank'+(x.username===S.me.username?" me":"")+'"><span class="rk">'+(x.cards?i+1:"–")+"</span>"+hpAv(x.username)+
    '<span class="grow nm">'+esc(x.display_name)+'</span><span class="rbar"><i style="width:'+Math.round(x.cards/top*100)+'%"></i></span><b class="rc">'+x.cards+"</b></div>").join("")}
function salesChart(st){
  const vw=(document.getElementById("view")||{}).clientWidth||700,W=Math.max(300,Math.min(1100,vw-80)),H=190,P=24,s=st.series,cfg=st.settings,n=s.length;if(!n)return "";
  const max=Math.max(cfg.daily_target*1.25,...s.map(x=>x.cards||0)),bw=(W-2*P)/n,y=v=>H-P-(H-2*P)*v/max;
  let g='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Cartes vendues par jour">';
  g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(cfg.daily_target)+'" y2="'+y(cfg.daily_target)+'" stroke="var(--ok)" stroke-dasharray="5 4"/>'+
    '<text x="'+(W-P)+'" y="'+(y(cfg.daily_target)-5)+'" text-anchor="end">objectif '+cfg.daily_target+"</text>";
  s.forEach((x,i)=>{const bx=P+i*bw+1.5,w=Math.max(2,bw-3);
    if(x.cards==null){g+='<rect x="'+bx+'" y="'+(H-P-2)+'" width="'+w+'" height="2" fill="var(--border)"/>';return}
    const bh=Math.max(1.5,(H-2*P)*x.cards/max),hit=x.cards>=cfg.daily_target,cur=x.day===st.day;
    g+='<rect x="'+bx+'" y="'+(H-P-bh)+'" width="'+w+'" height="'+bh+'" rx="2" fill="'+(hit?"var(--ok)":"var(--primary)")+'"'+(cur?' stroke="var(--ink)" stroke-width="1.5"':"")+"><title>"+esc(fmtDay(x.day))+" : "+x.cards+" carte(s)</title></rect>"});
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{const d=parseD(s[i].day);g+='<text x="'+(P+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+d.getDate()+" "+MOIS[d.getMonth()]+"</text>"});
  return g+"</svg>"}
function saleLine(x){
  const mine=x.username===S.me.username||x.created_by===S.me.username;
  const canCancel=!x.cancelled&&(isLead()||(canEdit()&&mine&&x.day===today()&&x.origin!=="handypay"));
  const time=x.created_at?new Date(x.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
  const who=[x.client_name,fmtPhone(x.client_phone)].filter(Boolean).join(" · ");
  return '<div class="line sale'+(x.cancelled?" off":"")+'">'+hpAv(x.username)+'<span class="t"><b>'+x.cards+" carte"+(x.cards>1?"s":"")+"</b> · "+esc(x.username?nameOf(x.username):"Direct (HandyPay)")+(who?"<small>"+esc(who)+"</small>":"")+"</span>"+
    (x.origin==="handypay"&&x.source==="autre"?"":'<span class="pill">'+esc(SRC_L[x.source]||x.source)+"</span>")+(x.origin==="handypay"?'<span class="pill info">HandyPay</span>':"")+(x.cancelled?'<span class="pill warn">annulée</span>':"")+
    '<span class="small faint">'+esc(time)+"</span>"+(isLead()&&!x.cancelled?'<button class="btn sm ghost" data-sa="edit" data-id="'+esc(x.id)+'">Corriger</button>':"")+
    (canCancel?'<button class="btn sm ghost danger-t" data-sa="cancel" data-id="'+esc(x.id)+'">Annuler</button>':"")+"</div>"}
async function vSales(){
  const day=S.salesDay||today(),seq=++S.seq;
  if(!$("#sales-root"))V().innerHTML='<div id="sales-root" class="muted">Chargement…</div>';
  let st,ls;
  try{[st,ls]=await Promise.all([api("GET",API+"/sales/stats?day="+day),api("GET",API+"/sales?day="+day)])}
  catch(e){if(seq===S.seq&&S.view==="ventes")V().innerHTML='<div class="empty card">'+esc(e.message)+"</div>";return}
  if(seq!==S.seq||S.view!=="ventes")return;
  S.salesSettings=st.settings;S.salesList=ls.sales;
  const t=st.today,c=st.campaign,nm=c.next_milestone,cur=c.currency,live=day===today();
  let h='<div id="sales-root">'+dayNav("sales",day,isLead()?'<span class="grow"></span><button class="btn sm" data-sa="settings">Réglages</button>':"");
  if(canEdit()&&live)h+='<div class="card closer"><div class="qty" role="group" aria-label="Nombre de cartes"><button type="button" class="qbtn" data-sa="minus" aria-label="Une carte de moins">−</button>'+
    '<input id="qty" type="number" inputmode="numeric" min="1" max="500" value="1" aria-label="Nombre de cartes"><button type="button" class="qbtn" data-sa="plus" aria-label="Une carte de plus">+</button></div>'+
    '<button class="btn primary big" data-sa="add">+ Carte closée</button><button class="btn ghost" data-sa="more">Avec le client…</button></div>';
  h+='<div class="tiles">'+
    tileX(live?"Aujourd'hui":fmtDay(day),intf(t.cards)+"<small> / "+intf(t.target)+"</small>",pbar(t.pct,t.cards>=t.target?"ok":""))+
    tileX("Cumul de la campagne",intf(c.cumul)+"<small> / "+intf(c.target)+"</small>",pbar(c.cumul/c.target)+(nm?'<div class="small muted">Jalon '+intf(nm.target)+" le "+esc(fmtDay(nm.date))+"</div>":""))+
    tileX("Écart au rythme",'<span style="color:'+(c.gap<0?"var(--danger)":"var(--ok)")+'">'+(c.gap>0?"+":"")+intf(c.gap)+"</span>",'<div class="small muted">attendu '+intf(c.expected)+(nm&&nm.remaining?" · "+intf(nm.per_day_needed)+" / jour pour le jalon":"")+"</div>")+
    tileX("Marge",money(c.margin,cur),'<div class="small muted">'+money(t.margin,cur)+(live?" aujourd'hui":" ce jour-là")+"</div>")+"</div>";
  h+='<div class="grid2 eq"><div class="card sec"><h2>Classement du jour</h2>'+rankHTML(t.by_person)+'</div><div class="card sec"><h2>Semaine <span class="small muted">'+esc(fmtDay(st.week.start))+" → "+esc(fmtDay(st.week.end))+" · "+intf(st.week.cards)+"</span></h2>"+rankHTML(st.week.by_person)+"</div></div>";
  h+='<div class="card sec" style="margin-top:16px"><h2>Cartes par jour <span class="small muted">'+esc(fmtDay(c.start))+" → "+esc(fmtDay(c.end))+"</span></h2>"+salesChart(st)+
    '<div class="ms">'+c.milestones.map(m=>'<span class="pill '+(m.reached?"ok":(m.date<day?"danger":""))+'" title="'+(m.cumul_at!=null?"Cumul à cette date : "+m.cumul_at:"À venir")+'">'+esc(fmtDay(m.date))+" · "+intf(m.target)+(m.reached?" ✓":"")+"</span>").join("")+"</div></div>";
  h+='<div class="card sec" style="margin-top:16px"><h2>Saisies '+(live?"du jour":"du "+esc(fmtDay(day)))+' <span class="small muted">'+ls.sales.filter(x=>!x.cancelled).length+"</span></h2>"+
    (ls.sales.length?(S.salesAll?ls.sales:ls.sales.slice(0,12)).map(saleLine).join("")+(ls.sales.length>12&&!S.salesAll?'<div style="padding-top:8px"><button class="btn sm ghost" data-sa="all">Voir les '+ls.sales.length+" saisies</button></div>":""):'<div class="empty">Aucune vente saisie.</div>')+"</div></div>";
  V().innerHTML=h;
}
async function salesAct(el){
  const a=el.dataset.sa;
  if(a==="minus"||a==="plus"){const q=$("#qty");q.value=Math.max(1,Math.min(500,(Number(q.value)||1)+(a==="plus"?1:-1)));return}
  if(a==="add"){const n=Math.max(1,Math.min(500,Math.round(Number(($("#qty")||{}).value)||1)));el.disabled=true;
    try{const r=await api("POST",API+"/sales",{cards:n});toast(n+" carte"+(n>1?"s":"")+" closée"+(n>1?"s":"")+" !",null,{label:"Annuler",run:()=>cancelSale(r.sale.id,true)});refreshMeta();render()}
    catch(e){fail(e)}finally{el.disabled=false}return}
  if(a==="more")return saleModal();
  if(a==="edit")return saleModal((S.salesList||[]).find(x=>x.id===el.dataset.id));
  if(a==="cancel")return cancelSale(el.dataset.id);
  if(a==="settings")return salesSettingsModal();
  if(a==="all"){S.salesAll=true;return render()}
}
async function cancelSale(id,quiet){
  if(!quiet&&!confirm("Annuler cette saisie ? Elle ne comptera plus."))return;
  try{await api("DELETE",API+"/sales/"+id);toast("Saisie annulée.");refreshMeta();if(S.view==="ventes"||S.view==="soir"||S.view==="home")render()}catch(e){fail(e)}}
function saleModal(x){
  const edit=!!x;x=x||{cards:1,client_name:"",client_phone:"",source:"whatsapp",note:"",username:S.me.username,day:today()};
  const sellers=S.members.filter(m=>!m.is_ai);
  modal(edit?"Corriger la vente":"Carte closée",
    '<div class="row"><div style="width:110px"><label class="f">Cartes</label><input type="number" name="cards" min="1" max="500" value="'+esc(x.cards)+'"></div>'+
    '<div class="grow"><label class="f">Source</label><select name="source">'+Object.entries(SRC_L).map(([k,l])=>'<option value="'+k+'"'+(x.source===k?" selected":"")+">"+l+"</option>").join("")+"</select></div></div>"+
    '<div class="row"><div class="grow"><label class="f">Client (facultatif)</label><input type="text" name="client_name" maxlength="120" value="'+esc(x.client_name)+'"></div>'+
    '<div class="grow"><label class="f">Téléphone (facultatif)</label><input type="tel" name="client_phone" maxlength="30" value="'+esc(x.client_phone)+'" placeholder="3412 3456"></div></div>'+
    '<label class="f">Note</label><input type="text" name="note" maxlength="500" value="'+esc(x.note)+'">'+
    (isLead()?'<div class="row"><div class="grow"><label class="f">Vendeur</label><select name="username">'+(edit?'<option value="">Direct (HandyPay)</option>':"")+sellers.map(m=>'<option value="'+esc(m.username)+'"'+(x.username===m.username?" selected":"")+">"+esc(m.display_name)+"</option>").join("")+"</select></div>"+
      '<div class="grow"><label class="f">Jour</label><input type="date" name="day" max="'+today()+'" value="'+esc(x.day)+'"></div></div>':""),
    edit?"Enregistrer":"Enregistrer la vente",async fd=>{
      const body={cards:Number(fv(fd,"cards")||1),source:fv(fd,"source"),client_name:fv(fd,"client_name"),client_phone:fv(fd,"client_phone"),note:fv(fd,"note")};

      toast(edit?"Vente corrigée.":"Vente enregistrée.");refreshMeta();render()});
}
function salesSettingsModal(){
  const c=S.salesSettings;if(!c)return;
  modal("Réglages des ventes",
    '<div class="row"><div class="grow"><label class="f">Objectif par jour</label><input type="number" name="daily_target" min="1" value="'+c.daily_target+'"></div>'+
    '<div class="grow"><label class="f">Objectif total</label><input type="number" name="total_target" min="1" value="'+c.total_target+'"></div>'+
    '<div class="grow"><label class="f">Marge par carte ($)</label><input type="number" step="0.01" min="0" name="margin_per_card" value="'+c.margin_per_card+'"></div></div>'+
    '<div class="row"><div class="grow"><label class="f">Début</label><input type="date" name="start" value="'+esc(c.start)+'"></div><div class="grow"><label class="f">Fin</label><input type="date" name="end" value="'+esc(c.end)+'"></div></div>'+
    '<label class="f">Jalons : une ligne par jalon, « date cumul »</label><textarea name="milestones" style="min-height:110px;font-family:ui-monospace,Consolas,monospace">'+esc(c.milestones.map(m=>m.date+" "+m.target).join("\n"))+"</textarea>",
    "Enregistrer",async fd=>{
      const ms=fv(fd,"milestones").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d{4}-\d{2}-\d{2})[\s;:,]+(\d+)$/);
        if(!m)throw new Error("Jalon illisible : « "+l+" » (attendu : 2026-11-22 700)");return {date:m[1],target:Number(m[2])}});
      const r=await api("PUT",API+"/settings/sales",{daily_target:Number(fv(fd,"daily_target")),total_target:Number(fv(fd,"total_target")),margin_per_card:Number(fv(fd,"margin_per_card")),
        start:fv(fd,"start"),end:fv(fd,"end"),currency:c.currency||"USD",milestones:ms});
      S.salesSettings=r.settings;toast("Réglages enregistrés.");refreshMeta();render()});
}

/* ══ Relances WhatsApp ═════════════════════════════════════════ */
function renderMsg(body,name,me){
  const w=String(name||"").trim().split(/\s+/).filter(Boolean),p=w[0]||"",n=w.slice(1).join(" ");
  const t=String(body||"").replace(/\{\s*prenom\s*\}/gi,p).replace(/\{\s*nom\s*\}/gi,n).replace(/\{\s*moi\s*\}/gi,String(me||"").split(" ")[0]);
  return t.replace(/[ \t]{2,}/g," ").replace(/ +([,.!?;:])/g,"$1").replace(/(^|\n)[ ,]+/g,"$1").trim()}
function waHref(phone,text){return "https://wa.me/"+String(phone||"").replace(/\D/g,"")+(text?"?text="+encodeURIComponent(text):"")}
function tplFor(f){const act=(S.tplMsg||[]).filter(t=>t.active);return act.find(t=>t.stage===f.stage)||act.find(t=>!t.stage)||act[0]||null}
function tplById(id){return (S.tplMsg||[]).find(t=>t.id===id)||null}
function foShell(){

  let h='<div class="fo-top"><div class="tabs" role="tablist"><button class="'+(F.view==="mine"?"on":"")+'" data-fo="tab" data-v="mine" role="tab">Ma file du jour<span class="cnt" id="fo-due">'+(S.foDue||"")+"</span></button>"+
    '<button class="'+(F.view==="all"?"on":"")+'" data-fo="tab" data-v="all" role="tab">Toutes les fiches</button></div><span class="grow"></span>'+
    (canEdit()?'<button class="btn sm" data-fo="new">+ Fiche</button><button class="btn sm" data-fo="import">Importer (CSV)</button>':"")+

    (F.view==="all"?'<select data-fof="assignee" aria-label="Personne">'+opt("","Tout le monde",F.assignee)+opt("__none","Non assignées",F.assignee)+S.members.filter(m=>!m.is_ai).map(m=>opt(m.username,m.display_name,F.assignee)).join("")+"</select>":"")+
